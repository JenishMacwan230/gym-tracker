<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181922"/>
      <stop offset="100%" stop-color="#0b0c10"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d5a"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box with Rounded Corners & Subtle Glow -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" stroke="rgba(255, 42, 61, 0.4)" stroke-width="14"/>

  <!-- Red Dumbbell Icon -->
  <g filter="url(#redGlow)">
    <!-- Left Small End Plate -->
    <rect x="84" y="192" width="40" height="128" rx="14" fill="url(#redGrad)"/>
    <!-- Left Main Heavy Weight Plate -->
    <rect x="136" y="144" width="48" height="224" rx="16" fill="url(#redGrad)"/>

    <!-- Center Connecting Bar -->
    <rect x="170" y="232" width="172" height="48" rx="10" fill="url(#redGrad)"/>

    <!-- Right Main Heavy Weight Plate -->
    <rect x="328" y="144" width="48" height="224" rx="16" fill="url(#redGrad)"/>
    <!-- Right Small End Plate -->
    <rect x="388" y="192" width="40" height="128" rx="14" fill="url(#redGrad)"/>
  </g>
</svg>